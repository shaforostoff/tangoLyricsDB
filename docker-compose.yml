# Production stack for tangotranslations.org on the e2-micro VM.
# Secrets live in .env next to this file (see .env.example).
name: tangolyricsdb

volumes:
  postgres-18: {}
  thruster-storage: {}

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ttdb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ttdb_production
    # Small footprint: the VM has 1 GB of RAM
    command: postgres -c shared_buffers=64MB -c max_connections=20
    volumes:
      - postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttdb -d ttdb_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./rails_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set in .env}
      DB_HOST: db
      DB_USER: ttdb
      DB_PASSWORD: ${DB_PASSWORD}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      # Redirect other host names (www., the bare IP is left alone) to this one
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      # Comma-separated domains; when set, Thruster gets Let's Encrypt certificates and Rails forces HTTPS
      TLS_DOMAIN: ${TLS_DOMAIN:-}
    volumes:
      # Thruster keeps its TLS certificates here
      - thruster-storage:/rails/storage
    ports:
      - "80:80"
      - "443:443"
